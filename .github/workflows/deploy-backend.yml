name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/database/**'
      - 'packages/shared-types/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Migrate and Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SHADOW_DATABASE_URL: ${{ secrets.SHADOW_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
      AWS_REGION: us-east-1
      SLS_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build backend
        run: bun run --filter @ops-forge/backend build

      - name: Install backend production dependencies for Lambda package
        working-directory: apps/backend
        run: npm install --omit=dev --no-audit --no-fund

      - name: Prepare database migration env file
        run: |
          cat > packages/database/.env << EOF
          DATABASE_URL=${DATABASE_URL}
          SHADOW_DATABASE_URL=${SHADOW_DATABASE_URL}
          EOF

      - name: Run production migrations
        run: bun run migrate

      - name: Validate generated DB types are committed
        run: |
          bun run generate-types
          git diff --exit-code -- packages/shared-types/src/db.generated.ts

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend with Serverless
        run: bun run --filter @ops-forge/backend deploy --stage prod
